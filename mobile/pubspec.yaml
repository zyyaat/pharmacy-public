name: pharmacy_mobile
description: Pharmacy OS — التطبيق المحمول للصيدلية (بناء عبر GitHub Actions بدون بيئة محلية)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # شبكة فقط — جلسة الكوكيز مُنفذة يدويًا في lib/core/cookies.dart
  # (الباك اند يعتمد جلسة كوكيز معتمة: pharmacy_access / pharmacy_refresh /
  #  pharmacy_csrf — لا يوجد Bearer، لذا أي حزمة كوكيز خارجية زائدة عن الحاجة)
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  # Task 82 — كشف انقطاع الشبكة فوريًا (واجهات الجهاز wifi/بيانات)؛
  # الإشارة الأصدق تأتي من نتائج API نفسها (core/offline.dart)
  connectivity_plus: ^6.1.4
  file_picker: ^8.1.2
  intl: 0.19.0
  # Task 68 — طباعة الإيصال الحراري عبر نظام الطباعة في أندرويد (نفس نهج window.print في الويب)
  pdf: ^3.11.1
  printing: ^5.13.1
  # Phase G — الدفع المضمّن: فورم Paymob داخل WebView في التطبيق نفسه
  # (بدون خروج لمتصفح خارجي). minSdk 23 من prepare_android.sh يكفي.
  webview_flutter: ^4.9.0
  # Windows desktop — بناء EXE بجانب الـAPK:
  # window_manager: نافذة 1280×820 بحد أدنى وتوسيط وعنوان العلامة.
  # path_provider: حفظ PDF المشارَك في Downloads على ويندوز (لا share sheet).
  # url_launcher: فورم Paymob في المتصفح الخارجي على ويندوز (لا WebView).
  window_manager: ^0.4.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
