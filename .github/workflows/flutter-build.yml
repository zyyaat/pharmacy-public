# Task 59 — بناء تطبيق الصيدلية المحمول بلا أي بيئة محلية:
# اضغط Run workflow ← (اختياري) أدخل عنوان الـ API ← Run ← نزّل الـ APK.
# Task 105 — التحميل للمستخدم النهائي من Releases (ملفات خام بلا ضغط — الموبايل
# لا يجيد فك ZIP): release-android بعد الأندرويد وrelease-windows بعد الويندوز،
# كل منها بوسم مستقل (android-build-N / windows-build-N) مع تقليم القديم (آخر 3).
# مجلد android/ يُولّد في السحابة من قالب نسخة Flutter المثبتة هنا ثم يُرقّع
# بـ mobile/scripts/prepare_android.sh — لا حاجة لـ Flutter على أي جهاز.

name: flutter-build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (اختياري — يفوق متغير المستودع API_BASE_URL)"
        required: false
        default: ""
        type: string
      flutter_version:
        description: "Flutter version"
        required: false
        default: "3.24.5"
        type: string
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-build.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.24.5' }}
          cache: true

      - name: Generate android/ scaffold from the pinned Flutter template
        run: |
          flutter --version
          rm -rf /tmp/gen
          flutter create /tmp/gen --project-name pharmacy_mobile --org com.zyyaat --platforms android
          rm -rf mobile/android
          cp -r /tmp/gen/android mobile/android

      - name: Restore fixed release keystore (توقيع ثابت — التحديث فوق النسخة المثبتة يعمل)
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Keystore secrets missing — release falls back to debug signing (update-over-install will be REJECTED)"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_STORE_PASS
          keyPassword=$KS_KEY_PASS
          keyAlias=$KS_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "OK: fixed keystore restored — same signature on every build"

      - name: Patch android/ (INTERNET + label + minSdk + packaging + signing)
        run: bash mobile/scripts/prepare_android.sh

      - name: Generate env.json (env-var layer — dart-define)
        working-directory: mobile
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="$INPUT_URL"
          if [ -z "$API_URL" ]; then API_URL="$VAR_URL"; fi
          if [ -z "$API_URL" ]; then
            API_URL="https://pharmacy-public.dockhosting.dev/api/v1"
            echo "::warning::API_BASE_URL is not set (neither run input nor repository variable) — using the baked-in production default (DockHosting)."
          fi
          printf '{"API_BASE_URL":"%s"}\n' "$API_URL" > env.json
          echo "Built with API_BASE_URL=$API_URL"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Smoke test (full-app compile check + model guards)
        working-directory: mobile
        run: flutter test

      - name: Build release APK (arm64-v8a — للهواتف الحديثة، التثبيت الناجح)
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Build release APK (universal — احتياط لكل المعماريات)
        working-directory: mobile
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Upload arm64 APK artifact (main)
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-mobile-apk-arm64-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload universal APK artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-mobile-apk-universal-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Task 105 — تحميل مباشر بلا ضغط: الموبايل لا يجيد فك ZIP الذي يلتف على
  # artifacts إجباريًا، فيُنشأ Release بوسم android-build-N يحمل APK الخام،
  # ويظهر فور نجاح بناء الأندرويد دون انتظار الويندوز.
  release-android:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pharmacy-mobile-apk-arm64-${{ github.run_number }}
          path: dl-arm64

      - uses: actions/download-artifact@v4
        with:
          name: pharmacy-mobile-apk-universal-${{ github.run_number }}
          path: dl-univ

      - name: Create GitHub Release (APK خام — تحميل مباشر للموبايل)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="1.0.${{ github.run_number }}"
          TAG="android-build-${{ github.run_number }}"
          mkdir -p rel
          cp dl-arm64/app-arm64-v8a-release.apk "rel/PharmacyOS-arm64-$V.apk"
          cp dl-univ/app-release.apk "rel/PharmacyOS-universal-$V.apk"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "rel/PharmacyOS-arm64-$V.apk" \
            "rel/PharmacyOS-universal-$V.apk" \
            --title "Pharmacy OS $V — أندرويد (تحميل مباشر)" \
            --notes "APK خام بدون ضغط — اضغط الملف في المتصفح ليبدأ التحميل فورًا ثم افتحه من الإشعارات وثبّته (اسمح مرة واحدة بالتثبيت من مصادر غير معروفة).
          • PharmacyOS-arm64-$V.apk — لهواتف أندرويد الحديثة (الاختيار الطبيعي، أصغر حجمًا)
          • PharmacyOS-universal-$V.apk — احتياط لكل المعماريات (أكبر حجمًا)"

      - name: Prune old android-build releases (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAGS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("android-build-"))] | sort_by(.created_at) | reverse | .[3:][] | .tag_name' 2>/dev/null || true)
          for T in $TAGS; do gh release delete "$T" --cleanup-tag -y || true; done

  # Windows desktop — EXE بجانب الـAPK: بناء Flutter Windows ثم مثبّت
  # Inno Setup احترافي (معالج عربي بصور العلامة) + حزمة portable مضغوطة.
  build-windows:
    # مثبّت عمدًا: في سبتمبر 2026 أصبحت windows-latest وحتى windows-2025 تشير
    # إلى صورة windows-2025-vs2026 (Visual Studio 18)، وFlutter 3.24.5 لا يختار
    # مولّد CMake إلا لـVS17 وإلا سقط لـ"VS 16 2019" غير الموجود (درس Run 34782289731).
    # windows-2022 هي العلامة الأخيرة التي تحمل VS2022 17.14 = المدعوم رسميًا؛
    # عند تقاعدها يلزم ترقية إصدار Flutter المدبّس (وليس مجرد تغيير العلامة).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.24.5' }}
          cache: true

      - name: Generate env.json (نفس طبقة dart-define الخاصة بالـAPK)
        working-directory: mobile
        shell: bash
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="$INPUT_URL"
          if [ -z "$API_URL" ]; then API_URL="$VAR_URL"; fi
          if [ -z "$API_URL" ]; then
            API_URL="https://pharmacy-public.dockhosting.dev/api/v1"
            echo "::warning::API_BASE_URL is not set (neither run input nor repository variable) — using the baked-in production default (DockHosting)."
          fi
          printf '{"API_BASE_URL":"%s"}\n' "$API_URL" > env.json
          echo "Built with API_BASE_URL=$API_URL"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Smoke test (compile check before the Windows build)
        working-directory: mobile
        run: flutter test

      - name: Generate windows/ scaffold from the pinned Flutter template
        shell: bash
        run: |
          flutter --version
          rm -rf /tmp/genw
          flutter create /tmp/genw --project-name pharmacy_mobile --org com.zyyaat --platforms windows
          rm -rf mobile/windows
          cp -r /tmp/genw/windows mobile/windows
          bash mobile/scripts/prepare_windows.sh
          ls mobile/windows/runner/resources/

      - name: Build Windows EXE
        working-directory: mobile
        run: flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Zip portable build (تشغيل مباشر بلا تثبيت)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'mobile/build/windows/x64/runner/Release/*' -DestinationPath "artifacts/PharmacyOS-windows-portable-1.0.${{ github.run_number }}.zip" -Force

      - name: Compile installer (Inno Setup — معالج عربي بصور العلامة)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="1.0.${{ github.run_number }}" mobile\setup\pharmacy_os_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows-setup-${{ github.run_number }}
          path: mobile/setup/output/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows-portable-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: error

  # Task 105 — نداء الويندوز مستقل بوسم windows-build-N حتى لا ينتظر مستخدم
  # الأندرويد انتهاء بناء سطح المكتب؛ الـ portable يبقى ZIP لأنه مجلد ملفات
  # وويندوز يفتحه أصلًا، أما المثبّت فـEXE مباشر.
  release-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pharmacy-windows-setup-${{ github.run_number }}
          path: dl-setup

      - uses: actions/download-artifact@v4
        with:
          name: pharmacy-windows-portable-${{ github.run_number }}
          path: dl-portable

      - name: Create GitHub Release (EXE مباشر)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="1.0.${{ github.run_number }}"
          TAG="windows-build-${{ github.run_number }}"
          mkdir -p rel
          cp dl-setup/*.exe "rel/PharmacyOS-Setup-$V.exe"
          cp dl-portable/*.zip "rel/PharmacyOS-windows-portable-$V.zip"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "rel/PharmacyOS-Setup-$V.exe" \
            "rel/PharmacyOS-windows-portable-$V.zip" \
            --title "Pharmacy OS $V — ويندوز" \
            --notes "المثبّت PharmacyOS-Setup-$V.exe مباشر بلا ضغط، وحزمة الـ portable مضغوطة لأنها مجلد ملفات يفتحه ويندوز أصلًا."

      - name: Prune old windows-build releases (keep newest 3)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAGS=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("windows-build-"))] | sort_by(.created_at) | reverse | .[3:][] | .tag_name' 2>/dev/null || true)
          for T in $TAGS; do gh release delete "$T" --cleanup-tag -y || true; done
