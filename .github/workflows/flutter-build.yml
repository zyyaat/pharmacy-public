# Task 59 — بناء تطبيق الصيدلية المحمول بلا أي بيئة محلية:
# اضغط Run workflow ← (اختياري) أدخل عنوان الـ API ← Run ← نزّل الـ APK من Artifacts.
# مجلد android/ يُولّد في السحابة من قالب نسخة Flutter المثبتة هنا ثم يُرقّع
# بـ mobile/scripts/prepare_android.sh — لا حاجة لـ Flutter على أي جهاز.

name: flutter-build

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (اختياري — يفوق متغير المستودع API_BASE_URL)"
        required: false
        default: ""
        type: string
      flutter_version:
        description: "Flutter version"
        required: false
        default: "3.24.5"
        type: string
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-build.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.24.5' }}
          cache: true

      - name: Generate android/ scaffold from the pinned Flutter template
        run: |
          flutter --version
          rm -rf /tmp/gen
          flutter create /tmp/gen --project-name pharmacy_mobile --org com.zyyaat --platforms android
          rm -rf mobile/android
          cp -r /tmp/gen/android mobile/android

      - name: Restore fixed release keystore (توقيع ثابت — التحديث فوق النسخة المثبتة يعمل)
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Keystore secrets missing — release falls back to debug signing (update-over-install will be REJECTED)"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_STORE_PASS
          keyPassword=$KS_KEY_PASS
          keyAlias=$KS_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "OK: fixed keystore restored — same signature on every build"

      - name: Patch android/ (INTERNET + label + minSdk + packaging + signing)
        run: bash mobile/scripts/prepare_android.sh

      - name: Generate env.json (env-var layer — dart-define)
        working-directory: mobile
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="$INPUT_URL"
          if [ -z "$API_URL" ]; then API_URL="$VAR_URL"; fi
          if [ -z "$API_URL" ]; then
            API_URL="https://pharmacy-public.dockhosting.dev/api/v1"
            echo "::warning::API_BASE_URL is not set (neither run input nor repository variable) — using the baked-in production default (DockHosting)."
          fi
          printf '{"API_BASE_URL":"%s"}\n' "$API_URL" > env.json
          echo "Built with API_BASE_URL=$API_URL"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Smoke test (full-app compile check + model guards)
        working-directory: mobile
        run: flutter test

      - name: Build release APK (arm64-v8a — للهواتف الحديثة، التثبيت الناجح)
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Build release APK (universal — احتياط لكل المعماريات)
        working-directory: mobile
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Upload arm64 APK artifact (main)
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-mobile-apk-arm64-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload universal APK artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-mobile-apk-universal-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Windows desktop — EXE بجانب الـAPK: بناء Flutter Windows ثم مثبّت
  # Inno Setup احترافي (معالج عربي بصور العلامة) + حزمة portable مضغوطة.
  build-windows:
    # مثبّت عمدًا: windows-latest صار يشير إلى windows-2025-vs2026 (Visual Studio 18)
    # وFlutter 3.24.5 لا يختار مولّد CMake إلا لـVS17 وإلا سقط لـ"VS 16 2019" غير الموجود
    # (درس Run 34781703717). صورة windows-2025 العادية تحمل VS2022 17.14 = المدعوم رسميًا.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.24.5' }}
          cache: true

      - name: Generate env.json (نفس طبقة dart-define الخاصة بالـAPK)
        working-directory: mobile
        shell: bash
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_URL="$INPUT_URL"
          if [ -z "$API_URL" ]; then API_URL="$VAR_URL"; fi
          if [ -z "$API_URL" ]; then
            API_URL="https://pharmacy-public.dockhosting.dev/api/v1"
            echo "::warning::API_BASE_URL is not set (neither run input nor repository variable) — using the baked-in production default (DockHosting)."
          fi
          printf '{"API_BASE_URL":"%s"}\n' "$API_URL" > env.json
          echo "Built with API_BASE_URL=$API_URL"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Smoke test (compile check before the Windows build)
        working-directory: mobile
        run: flutter test

      - name: Generate windows/ scaffold from the pinned Flutter template
        shell: bash
        run: |
          flutter --version
          rm -rf /tmp/genw
          flutter create /tmp/genw --project-name pharmacy_mobile --org com.zyyaat --platforms windows
          rm -rf mobile/windows
          cp -r /tmp/genw/windows mobile/windows
          bash mobile/scripts/prepare_windows.sh
          ls mobile/windows/runner/resources/

      - name: Build Windows EXE
        working-directory: mobile
        run: flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define-from-file=env.json

      - name: Zip portable build (تشغيل مباشر بلا تثبيت)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'mobile/build/windows/x64/runner/Release/*' -DestinationPath "artifacts/PharmacyOS-windows-portable-1.0.${{ github.run_number }}.zip" -Force

      - name: Compile installer (Inno Setup — معالج عربي بصور العلامة)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="1.0.${{ github.run_number }}" mobile\setup\pharmacy_os_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows-setup-${{ github.run_number }}
          path: mobile/setup/output/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-windows-portable-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: error
